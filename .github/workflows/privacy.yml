name: privacy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The denylist is a TSV held in the PRIVACY_DENYLIST_TSV secret, never in git. When the secret
      # is set it is written to a file outside the checkout and named by PRIVACY_DENYLIST, which
      # both scans read; a run without it, such as a pull request from a fork, scans the generic
      # rules alone and says so.
      - name: Load the denylist
        shell: bash
        env:
          PRIVACY_DENYLIST_TSV: ${{ secrets.PRIVACY_DENYLIST_TSV }}
        run: |
          set -euo pipefail
          if [ -n "${PRIVACY_DENYLIST_TSV:-}" ]; then
            denylist="$RUNNER_TEMP/privacy-denylist.tsv"
            (umask 077 && printf '%s\n' "$PRIVACY_DENYLIST_TSV" > "$denylist")
            echo "PRIVACY_DENYLIST=$denylist" >> "$GITHUB_ENV"
            echo "the scan runs with the denylist"
          else
            echo "PRIVACY_DENYLIST_TSV is not set: the scan ran without a denylist"
          fi
      - name: Scan the files
        run: bun scripts/privacy-check.ts .
      - name: Scan the history for secrets
        run: gitleaks git --redact --no-banner .
      - name: Scan every new commit
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE:-}" ]; then
            range="$PR_BASE..HEAD"
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD"
          fi
          bash scripts/privacy-history.sh "$range"
